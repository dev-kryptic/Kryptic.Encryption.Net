name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Incoming version override (leave empty to use the csproj Version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kryptic.Encryption.slnx

      - name: Test
        run: dotnet test Kryptic.Encryption.Tests/Kryptic.Encryption.Tests.csproj --configuration Release --no-restore

  publish:
    needs: test
    if: >
      github.actor != 'github-actions[bot]' &&
      github.actor != 'kryptic-release-bot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          INCOMING=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION:-}" ]; then
            INCOMING="$INPUT_VERSION"
          fi
          VERSION="$(python3 .github/scripts/resolve-package-version.py "${INCOMING}")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: ${VERSION}"

      - name: Set csproj version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("Kryptic.Encryption/Kryptic.Encryption.csproj")
          version = os.environ["VERSION"]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"<Version>[^<]+</Version>",
              f"<Version>{version}</Version>",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected exactly one <Version> element in the csproj")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          if git diff --quiet -- Kryptic.Encryption/Kryptic.Encryption.csproj; then
            echo "csproj already at ${VERSION}"
            exit 0
          fi
          git add Kryptic.Encryption/Kryptic.Encryption.csproj
          git commit -m "chore: release ${VERSION}"
          git push

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet restore Kryptic.Encryption/Kryptic.Encryption.csproj
          dotnet pack Kryptic.Encryption/Kryptic.Encryption.csproj \
            --configuration Release \
            --no-restore \
            --output ./nupkg \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}" \
            -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python3 .github/scripts/release-notes-from-changelog.py

      - name: Tag and GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git tag -a "$TAG" -m "Release ${VERSION}"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            gh release edit "$TAG" --title "$(basename "$GITHUB_REPOSITORY") ${VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$(basename "$GITHUB_REPOSITORY") ${VERSION}" --notes-file "$NOTES_FILE"
          fi
